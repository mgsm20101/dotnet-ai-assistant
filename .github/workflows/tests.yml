# Model-free tests only. The eval suite in tests/AiAssistant.Eval calls a local
# Ollama server and is run by scripts/run_eval.py, not here.
name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build AiAssistant.sln
      - name: Unit and in-process API tests
        run: dotnet test tests/AiAssistant.UnitTests/AiAssistant.UnitTests.csproj --no-build

  eval-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install pytest
      - name: Eval runner tests
        working-directory: scripts
        run: python -m pytest -q
